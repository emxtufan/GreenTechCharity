upstream greentech_charity_node {
    server 127.0.0.1:3002;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name greentechcharity.ro www.greentechcharity.ro;

    return 301 https://greentechcharity.ro$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name greentechcharity.ro www.greentechcharity.ro;

    # Certificatele si cheia privata sunt instalate direct pe server, niciodata in Git.
    ssl_certificate /etc/greentech-charity/tls/origin.crt;
    ssl_certificate_key /etc/greentech-charity/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:GREENTECH_TLS:10m;
    ssl_session_timeout 1d;

    root /srv/greentech-charity/current/dist;
    index index.html;
    autoindex off;
    server_tokens off;

    sendfile on;
    sendfile_max_chunk 2m;
    tcp_nopush on;
    etag on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    client_max_body_size 64k;

    # Endpoint de liveness al procesului Node. Raspunsul nu trebuie cache-uit.
    location = /healthz {
        proxy_pass http://greentech_charity_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Doar API-ul ajunge la Node. Restul site-ului este livrat direct de Nginx.
    location ^~ /api/ {
        proxy_pass http://greentech_charity_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # Panoul si raspunsurile sale nu trebuie pastrate de browser sau CDN.
    location ^~ /admin/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # Modelul 3D este versionat prin ?v=<sha256-prefix> in build.
    # Nginx livreaza Content-Length si suporta automat un singur byte range.
    location = /greencube-original-OE4BBULY.glb {
        types { model/gltf-binary glb; }
        try_files $uri =404;
        max_ranges 1;
        add_header Cache-Control "public, max-age=31536000, immutable, no-transform" always;
        add_header CDN-Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Aceste nume sunt stabile intre builduri si trebuie revalidate la fiecare vizita.
    location ~ ^/(?:index\.(?:js|css)|stage-worker\.js)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /brandbook-section/content.json {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header CDN-Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Vite foloseste hash in numele fisierelor din /assets/.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header CDN-Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Decodoarele au nume stabile; TTL-ul scurt permite actualizarea fara URL nou.
    location /decoder/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location ~* \.wasm$ {
        types { application/wasm wasm; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location ~* \.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Directorul persistent si fisierele ascunse nu sunt niciodata publice.
    location ^~ /storage/ {
        return 404;
    }

    location ~ (^|/)\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    error_page 404 /404/index.html;
    location = /404/index.html {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
