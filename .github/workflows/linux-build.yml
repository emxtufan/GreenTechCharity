name: Linux production build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SCENE_OFFSCREEN: "false"
      VITE_SCENE_DPR_MAX: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Instaleaza Bun
        uses: oven-sh/setup-bun@v2

      - name: Instaleaza dependentele din lockfile
        run: bun ci

      - name: Verifica TypeScript
        run: bun run lint

      - name: Construieste productia pe Linux
        run: bun run build

      - name: Valideaza buildul si modelul GLB
        run: bun run verify:dist
