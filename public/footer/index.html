<body>
  <iframe
    class="footer-frame"
    src="/brandbook-section/?entry=footer"
    title=""
    data-footer-content="wrapper.footer.frameTitle"
    loading="eager"
  ></iframe>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      function readPath(source, path) {
        return String(path || '').split('.').reduce(function (value, key) {
          return value == null ? undefined : value[key];
        }, source);
      }

      function applyAttributes(content) {
        document.querySelectorAll('[data-footer-content]').forEach(function (element) {
          var value = readPath(content, element.dataset.footerContent);
          if (value == null) return;
          if (element.tagName === 'META') element.setAttribute('content', String(value));
          else element.setAttribute('title', String(value));
        });
      }

      var ready = window.GreentechCharityContentReady;
      if (ready && typeof ready.then === 'function') ready.then(applyAttributes);
      else applyAttributes(window.GREENTECH_CHARITY_CONTENT || {});
    });
  </script>
</body>
