e","selectionText":"Analizam criterii sociale si locative impreuna cu parteneri competenti. Deciziile sunt documentate, iar datele personale sunt protejate.","privacyTitle":"Protectia familiei","privacyText":"Comunicam progresul fara a expune identitatea, istoricul personal sau datele sensibile ale familiei sprijinite.","contactTitle":"Contact","contactText":"Pentru informatii administrative, donatii sau parteneriate, foloseste datele publicate in pagina Contact."},"healthyHome":{"seo":{"title":"GREENTECH Charity | Un camin care protejeaza","description":"Descopera solutiile de lumina, ventilatie, izolatie si confort care transforma o locuinta intr-un camin sanatos.","canonicalPath":"/un-camin-sanatos/","robots":"index,follow"},"title":"Un camin care protejeaza","paragraph1":"O casa sanatoasa inseamna aer curat, lumina naturala, temperatura stabila si materiale usor de intretinut.","paragraph2":"Proiectam ventilatia, izolatia si instalatiile pentru a reduce umezeala, pierderile de energie si cheltuielile lunare.","paragraph3":"Pentru familie, aceste alegeri inseamna confort zilnic, mai multa siguranta si un camin pregatit pentru termen lung."},"volunteer":{"seo":{"title":"GREENTECH Charity | Voluntariat cu rol clar","description":"Afla cum voluntarii si specialistii se pot implica in etapele concrete ale proiectelor GREENTECH Charity.","canonicalPath":"/voluntariat/","robots":"index,follow"},"title":"Voluntariat cu rol clar","paragraph1":"Fiecare voluntar intra intr-un proces bine organizat, cu un rol potrivit experientei sale si cu reguli clare de siguranta.","paragraph2":"Specialistii pot contribui la proiectare, executie sau instalatii. Ceilalti voluntari pot sustine logistica, amenajarea, comunicarea si activitatile dedicate familiei.","paragraph3":"Aratam ce s-a realizat prin timpul oferit, pentru ca fiecare ora de implicare sa aiba un rezultat vizibil.","imageAlt":"Voluntariat - GREENTECH Charity"}}}};
