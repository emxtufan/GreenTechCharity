<body data-bb-standalone-interactions="projects" data-bb-content-page="projects">
  <a class="skip-link" href="#continut">Mergi la continut</a>

  <header class="site-header" data-site-header>
    <a class="brand" href="/" aria-label="GREENTECH Charity, pagina principala">
      <img class="brand__mark" src="/logo-charity.webp" alt="GREENTECH Charity" width="2418" height="2541">
    </a>
    <a class="back-link" href="/" data-back-link><span aria-hidden="true">←</span> Inapoi</a>
  </header>

  <main id="continut" tabindex="-1">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero__meta reveal" data-hero-meta></div>
      <h1 class="hero__title reveal" id="hero-title" data-hero-title></h1>
      <figure class="hero__media reveal" data-hero-media>
        <img data-hero-image alt="" width="1800" height="1350" fetchpriority="high">
        <figcaption data-hero-caption></figcaption>
      </figure>
      <div class="hero__footer reveal">
        <p data-hero-lead></p>
        <a class="round-link" href="#poveste" aria-label="Continua catre povestea proiectelor"><span aria-hidden="true">↓</span></a>
      </div>
    </section>

    <section class="story" id="poveste" aria-labelledby="story-title">
      <div class="story__intro">
        <p class="section-label reveal" data-story-label></p>
        <h2 class="display-title reveal" id="story-title" data-story-title></h2>
        <div class="story__intro-copy reveal" data-story-intro></div>
      </div>
      <article class="feature-story reveal" data-feature-story>
        <figure class="feature-story__media">
          <img data-feature-image alt="" width="1800" height="1350" loading="lazy">
          <figcaption data-feature-credit></figcaption>
        </figure>
        <div class="feature-story__copy">
          <p class="section-label" data-feature-eyebrow></p>
          <h3 data-feature-title></h3>
          <p data-feature-description></p>
          <dl data-feature-facts></dl>
        </div>
      </article>
    </section>

    <section class="impact" id="impact" aria-labelledby="impact-title">
      <div class="impact__heading reveal">
        <p class="section-label section-label--dark" data-impact-label></p>
        <h2 id="impact-title" data-impact-title></h2>
      </div>
      <div class="impact__facts" data-impact-facts></div>
    </section>

    <section class="field-notes" aria-labelledby="field-title">
      <div class="field-notes__heading">
        <p class="section-label reveal" data-field-label></p>
        <h2 class="display-title reveal" id="field-title" data-field-title></h2>
      </div>
      <div class="field-notes__grid" data-field-gallery></div>
    </section>

    <section class="cases" id="proiecte" aria-labelledby="cases-title">
      <header class="cases__header reveal">
        <div>
          <p class="section-label" data-cases-label></p>
          <h2 class="display-title" id="cases-title" data-cases-title></h2>
        </div>
        <p class="cases__intro" data-cases-intro></p>
      </header>
      <div class="carousel reveal" data-carousel>
        <div class="carousel__toolbar">
          <p class="carousel__position" aria-live="polite" data-carousel-position>01 / 01</p>
          <div class="carousel__controls">
            <button type="button" data-carousel-prev aria-label="Proiectul anterior"><span aria-hidden="true">←</span></button>
            <button type="button" data-carousel-next aria-label="Proiectul urmator"><span aria-hidden="true">→</span></button>
          </div>
        </div>
        <div class="carousel__viewport" data-carousel-viewport tabindex="0" aria-label="Cazurile si proiectele GREENTECH Charity">
          <div class="carousel__track" data-cases-track></div>
        </div>
      </div>
    </section>

    <section class="closing" aria-labelledby="closing-title">
      <p class="section-label section-label--light reveal" data-closing-label></p>
      <h2 class="reveal" id="closing-title" data-closing-title></h2>
      <div class="closing__actions reveal">
        <a class="button button--lime" href="mailto:help@greentechcharity.ro" data-bb-modal-open="footer-contact" data-closing-primary></a>
      </div>
    </section>
  </main>

  <dialog class="case-dialog" data-case-dialog aria-labelledby="case-dialog-title">
    <div class="case-dialog__shell">
      <button class="case-dialog__close" type="button" data-case-close aria-label="Inchide proiectul"><span aria-hidden="true">×</span></button>
      <figure class="case-dialog__media">
        <img data-case-dialog-image alt="" width="1600" height="1200">
        <figcaption data-case-dialog-credit></figcaption>
      </figure>
      <article class="case-dialog__content">
        <p class="section-label" data-case-dialog-meta></p>
        <h2 id="case-dialog-title" data-case-dialog-title></h2>
        <p class="case-dialog__summary" data-case-dialog-summary></p>
        <div class="case-dialog__stats" data-case-dialog-stats></div>
        <div class="case-dialog__columns">
          <div><h3>De ce este nevoie acum</h3><ul data-case-dialog-needs></ul></div>
          <div><h3>Etapele proiectului</h3><ol data-case-dialog-steps></ol></div>
        </div>
        <a class="button button--dark" href="mailto:help@greentechcharity.ro" data-bb-modal-open="footer-contact" data-bb-intent="donatie" data-case-dialog-action>Spune-ne cum vrei sa ajuti</a>
      </article>
    </div>
  </dialog>

  <dialog id="bb-outro-modal" class="bb-modal" aria-labelledby="bb-modal-title" aria-describedby="bb-modal-description">
    <button class="bb-modal__backdrop" type="button" tabindex="-1" data-bb-modal-close aria-label="Inchide"></button>
    <section class="bb-modal__panel">
      <header class="bb-modal__header">
        <div><p class="bb-modal__eyebrow" data-bb-modal-eyebrow></p><h2 id="bb-modal-title" data-bb-modal-title></h2></div>
        <button class="bb-modal__close" type="button" data-bb-modal-close aria-label="Inchide"><span></span><span></span></button>
      </header>
      <div class="bb-modal__scroll" data-bb-modal-content>
        <p id="bb-modal-description" class="sr-only">Informatii si formular GREENTECH Charity.</p>
      </div>
    </section>
  </dialog>

  <p class="sr-only" data-project-announcer aria-live="polite"></p>
  <noscript><p class="noscript">Pentru a vedea proiectele interactive, activeaza JavaScript.</p></noscript>
</body>
